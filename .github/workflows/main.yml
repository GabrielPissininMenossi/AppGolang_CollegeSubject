name: Publicação automática Golang
on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Configura o Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Compila o binário para Linux
        run: |
          GOOS=linux GOARCH=amd64 go build -o appgolang .

      - name: Cria arquivo temporário com a chave privada
        run: |
          echo "${{ secrets.KEY }}" > /tmp/private_key
          chmod 600 /tmp/private_key

      - name: Faz backup do binário atual no servidor
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
            "cp /home/ubuntu/projeto-golang/appgolang /home/ubuntu/projeto-golang/backups/appgolang_\$(date +%Y%m%d%H%M%S) || mkdir -p /home/ubuntu/projeto-golang/backups && cp /home/ubuntu/projeto-golang/appgolang /home/ubuntu/projeto-golang/backups/appgolang_\$(date +%Y%m%d%H%M%S)"

      - name: Para o serviço antes de atualizar o binário
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
            "sudo systemctl stop appgolang.service"

      - name: Envia o binário atualizado para o servidor
        run: |
          scp -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null \
            appgolang ubuntu@${{ secrets.HOST }}:/home/ubuntu/projeto-golang/appgolang

      - name: Ajusta permissão de execução e reinicia o serviço
        run: |
          ssh -i /tmp/private_key -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null ubuntu@${{ secrets.HOST }} \
            "chmod +x /home/ubuntu/projeto-golang/appgolang && sudo systemctl start appgolang.service"

      - name: Limpa a chave privada
        if: always()
        run: |
          rm -f /tmp/private_key

      - name: Notifica sucesso no Discord
        if: success()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            --data '{"content": "✅ Deploy do appgolang realizado com sucesso!"}' \
            ${{ secrets.DISCORD_WEBHOOK }}

      - name: Notifica falha no Discord
        if: failure()
        run: |
          curl -X POST -H "Content-Type: application/json" \
            --data '{"content": "❌ Falha no deploy do appgolang! Verifique os logs da Action."}' \
            ${{ secrets.DISCORD_WEBHOOK }}
